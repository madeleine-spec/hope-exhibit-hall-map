<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOPE Conference Exhibit Hall Map</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

#map-container {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
}

#map-container:active {
    cursor: grabbing;
}

#map {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    transform-origin: center center;
    image-rendering: auto;
}

.controls {
    position: absolute;
    bottom: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
}

.controls button {
    width: 44px;
    height: 44px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: white;
    color: #2D2E97;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.controls button:hover {
    background: #f0f0f0;
}

#reset {
    font-size: 12px;
}

</style>
</head>

<body>

<div id="map-container">

    <img
        id="map"
        src="exhibit-hall-map.png"
        alt="HOPE Conference Exhibit Hall Map"
        draggable="false"
    >

    <div class="controls">
        <button id="zoom-in" aria-label="Zoom in">+</button>
        <button id="zoom-out" aria-label="Zoom out">−</button>
        <button id="reset">Reset</button>
    </div>

</div>

<script>

const container = document.getElementById("map-container");
const map = document.getElementById("map");

let scale = 1;
let posX = 0;
let posY = 0;

const minScale = 1;
const maxScale = 5;

let pointers = new Map();
let lastCenter = null;
let lastDistance = null;

function updateMap() {
    map.style.transform =
        `translate(${posX}px, ${posY}px) scale(${scale})`;
}

function zoom(factor) {
    scale = Math.max(
        minScale,
        Math.min(maxScale, scale * factor)
    );

    updateMap();
}

document.getElementById("zoom-in").onclick = () => {
    zoom(1.3);
};

document.getElementById("zoom-out").onclick = () => {
    zoom(1 / 1.3);
};

document.getElementById("reset").onclick = () => {
    scale = 1;
    posX = 0;
    posY = 0;
    updateMap();
};

function getGesture() {
    const points = [...pointers.values()];

    if (points.length === 0) return null;

    const center = {
        x: points.reduce((sum, p) => sum + p.x, 0) / points.length,
        y: points.reduce((sum, p) => sum + p.y, 0) / points.length
    };

    let distance = null;

    if (points.length >= 2) {
        distance = Math.hypot(
            points[0].x - points[1].x,
            points[0].y - points[1].y
        );
    }

    return { center, distance };
}

container.addEventListener("pointerdown", e => {

    if (e.target.closest(".controls")) return;

    container.setPointerCapture(e.pointerId);

    pointers.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY
    });

    const gesture = getGesture();

    lastCenter = gesture.center;
    lastDistance = gesture.distance;
});

container.addEventListener("pointermove", e => {

    if (!pointers.has(e.pointerId)) return;

    pointers.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY
    });

    const gesture = getGesture();

    if (lastCenter) {
        posX += gesture.center.x - lastCenter.x;
        posY += gesture.center.y - lastCenter.y;
    }

    if (gesture.distance && lastDistance) {
        scale = Math.max(
            minScale,
            Math.min(
                maxScale,
                scale * gesture.distance / lastDistance
            )
        );
    }

    lastCenter = gesture.center;
    lastDistance = gesture.distance;

    updateMap();
});

function endPointer(e) {

    pointers.delete(e.pointerId);

    const gesture = getGesture();

    lastCenter = gesture ? gesture.center : null;
    lastDistance = gesture ? gesture.distance : null;
}

container.addEventListener("pointerup", endPointer);
container.addEventListener("pointercancel", endPointer);

container.addEventListener("wheel", e => {

    e.preventDefault();

    zoom(e.deltaY < 0 ? 1.1 : 1 / 1.1);

}, { passive: false });

updateMap();

</script>

</body>
</html>
